name: Build NAV mirror
on:
  schedule:
    - cron: "0 19 * * *"
    - cron: "30 2 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: build-nav
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build NAV mirror
        run: python scripts/build_nav.py
      - name: Commit accumulated history
        run: |
          git config user.name  "nav-mirror-bot"
          git config user.email "nav-mirror-bot@users.noreply.github.com"
          git add data/history docs/mf docs/manifest.json
          if git diff --cached --quiet; then
            echo "No NAV changes today."
          else
            git commit -m "NAV update $(date -u +%Y-%m-%d)"
            git push
          fi
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
